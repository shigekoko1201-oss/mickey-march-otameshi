<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミッキーマウス・マーチ 練習（おためし版）</title>
<style>
  :root {
    --ink: #222;
    --sub: #666;
    --line: #ddd;
    --accent: #d9363e;
    --btn: #f3f3f3;
    --btn-on: #ffe45c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink); }
  body {
    font-family: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif;
  }

  .partnav { background: #fff; padding: 10px 16px 0; }
  .player {
    position: sticky; top: 0; z-index: 10;
    background: #fff;
    border-bottom: 2px solid var(--line);
    padding: 6px 16px 10px;
  }
  /* 広い画面ではパート切替も上に固定。せまい画面では楽譜が見えるように再生バーだけ固定 */
  @media (min-width: 900px) {
    .partnav { position: sticky; top: 0; z-index: 11; }
    .player { top: var(--navh, 0px); }
  }
  .navtoggle { text-align: center; margin-bottom: 8px; }
  .navtoggle button {
    font-size: 15px; font-weight: normal; min-height: 36px; padding: 4px 16px;
    border-radius: 18px; border-width: 1px; background: #fff; color: var(--sub);
  }
  .partnav.closed #partlist { display: none; }
  .partnav.closed .navtoggle { margin-bottom: 0; }
  .partnav.closed .navtoggle button { color: var(--ink); border-color: #1f6fd1; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  h1 { font-size: 20px; margin: 0 12px 0 0; white-space: nowrap; }

  .parts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .parts + .parts { margin-bottom: 10px; }
  .parts button { min-width: 130px; }
  .parts[aria-label="がっき"] button, .parts[aria-label="だがっき"] button { min-height: 40px; padding: 4px 14px; }
  .parts button small { display: block; font-size: 13px; color: #b8860b; letter-spacing: 1px; }
  .parts button:disabled { opacity: .45; cursor: not-allowed; }
  .trial { text-align: center; color: var(--sub); font-size: 15px; margin: 0 0 10px; }
  .parts button.on { background: #1f6fd1; border-color: #1f6fd1; color: #fff; }
  .parts button.on small { color: #ffe45c; }

  button {
    font: inherit; font-size: 18px; font-weight: bold;
    border: 2px solid #bbb; border-radius: 12px;
    background: var(--btn); color: var(--ink);
    padding: 8px 14px; min-height: 48px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(0.97); }
  #play {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-size: 22px; min-width: 150px;
  }
  .speed button.on { background: var(--btn-on); border-color: #c9a800; }
  .speed span { font-size: 16px; color: var(--sub); margin-right: 2px; }

  .seek { display: flex; align-items: center; gap: 10px; margin-top: 8px; max-width: 900px; margin-left: auto; margin-right: auto; }
  .seek input { flex: 1; height: 32px; accent-color: var(--accent); }
  .time { font-size: 16px; font-variant-numeric: tabular-nums; color: var(--sub); min-width: 90px; text-align: center; }

  main { padding: 12px 16px 40px; }
  .score {
    display: block; width: 100%; max-width: 1100px; height: auto; margin: 0 auto;
  }
  .scorewrap { position: relative; max-width: 1100px; margin: 0 auto; }
  .hl {
    position: absolute; display: none; pointer-events: none;
    background: rgba(230, 0, 18, .16); border: 3px solid #e60012; border-radius: 8px;
  }
  .hl.show { display: block; }
  .hl span {
    position: absolute; right: 4px; top: 4px; background: #e60012; color: #fff;
    font-size: 14px; font-weight: bold; padding: 1px 8px; border-radius: 10px; white-space: nowrap;
  }
  .hl span:empty { display: none; }
  .scorewrap .score { cursor: pointer; }
  .note { text-align: center; color: var(--sub); font-size: 14px; margin-top: 16px; }

  @media (max-width: 600px) {
    h1 { width: 100%; text-align: center; margin: 0 0 4px; font-size: 18px; }
    button { font-size: 16px; padding: 6px 10px; }
    .parts button { min-width: 0; flex: 1 1 40%; }
    #play { min-width: 120px; font-size: 20px; }
  }
  /* ---- 上の 操作部分を うすく まとめる ---- */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .partnav.closed { display: none; }
  .partnav { position: relative; }
  .navtoggle { margin-bottom: 6px; }
  @media (min-width: 900px) {
    /* パートの 行の 右上に「かくす」を おいて、1行 へらす */
    .navtoggle { position: absolute; right: 16px; top: 10px; margin: 0; z-index: 1; }
  }
  .player { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 18px; padding: 8px 16px; }
  .ctrl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
  .ctrl:first-of-type { flex: 1 1 560px; }
  .ctrl button { min-height: 44px; padding: 6px 12px; }
  #play { min-width: 130px; font-size: 20px; }
  .partbtn { border-color: #1f6fd1; color: #1f6fd1; background: #fff; }
  .seek { flex: 1 1 220px; margin: 0; max-width: none; }
  .ctrl2 button { min-height: 38px; font-size: 16px; padding: 4px 10px; }
  .speed { display: flex; align-items: center; gap: 6px; }
  .speed span { font-size: 15px; }
  .mode { display: flex; gap: 6px; margin: 0; }
  .mode[hidden] { display: none; }
  @media (max-width: 600px) {
    .player { padding: 6px 10px; gap: 6px; }
    .ctrl button { min-height: 40px; padding: 4px 8px; }
    #play { min-width: 104px; font-size: 18px; }
    .ctrl2 button { font-size: 14px; padding: 3px 8px; }
    .seek { flex-basis: 100%; }
  }
  /* パートは ドロップダウンで えらぶ（ボタンの 段は かくす） */
  .partnav, #partbtn { display: none !important; }
  .partsel {
    font: inherit; font-size: 18px; font-weight: bold; color: #1f6fd1;
    min-height: 44px; padding: 4px 10px; border: 2px solid #1f6fd1; border-radius: 12px;
    background: #fff; cursor: pointer; max-width: 100%;
  }
  @media (max-width: 600px) { .partsel { font-size: 16px; min-height: 40px; } }
</style>
</head>
<body>

<nav class="partnav" id="partnav">
  <div class="navtoggle"><button id="navtoggle" type="button" aria-expanded="true" aria-controls="partlist">▲ パートを かくす</button></div>
  <div id="partlist">
  <div class="parts" role="tablist" aria-label="パート">
    <button type="button" role="tab" data-part="kenhamo1">けんハモ１<small>★★</small></button>
    <button type="button" role="tab" data-part="kenhamo2">けんハモ２<small>★★★</small></button>
    <button type="button" role="tab" data-part="recorder1">リコーダー１<small>★</small></button>
    <button type="button" role="tab" data-part="recorder2">リコーダー２<small>★★</small></button>
  </div>
  <div class="parts" role="tablist" aria-label="がっき">
    <button type="button" role="tab" data-part="glockenspiel">てっきん</button>
    <button type="button" role="tab" data-part="xylophone">もっきん</button>
    <button type="button" role="tab" data-part="bass">低音楽器</button>
  </div>
  <div class="parts" role="tablist" aria-label="だがっき">
    <button type="button" role="tab" data-part="tambourine">タンバリン</button>
    <button type="button" role="tab" data-part="snare">小だいこ</button>
    <button type="button" role="tab" data-part="bassdrum">大だいこ</button>
    <button type="button" role="tab" data-part="cymbal">シンバル</button>
  </div>
  </div>
</nav>

<div class="player">
  <h1 class="sr">ミッキーマウス・マーチ</h1>
  <div class="ctrl">
    <button id="partbtn" type="button" class="partbtn" hidden>🎼 パート ▼</button>
    <select id="partsel" class="partsel" aria-label="パートを えらぶ"></select>
    <button id="play" type="button">▶ さいせい</button>
    <button id="top" type="button">⏮ さいしょ</button>
    <button id="back" type="button">⏪ 5びょう</button>
    <div class="seek">
      <input id="bar" type="range" min="0" max="100" step="0.1" value="0" aria-label="いまの いち">
      <div class="time" id="time">0:00 / 0:00</div>
    </div>
  </div>
  <div class="ctrl ctrl2">
    <div class="speed" role="group" aria-label="はやさ">
      <span>はやさ</span>
      <button type="button" data-rate="0.5">ゆっくり</button>
      <button type="button" data-rate="0.75">すこし ゆっくり</button>
      <button type="button" data-rate="1" class="on">ふつう</button>
    </div>
  </div>
</div>

<main>
  <p class="trial">おためし版です。リコーダー１だけ つかえます。</p>
  <div class="scorewrap">
    <img class="score" id="score" alt="">
    <div class="hl" id="hl"><span id="hlcount"></span></div>
  </div>
  <p class="note">がくふを タッチすると、そこから さいせい します。スペースキーでも さいせい・ていし できます</p>
</main>

<audio id="audio" preload="auto"></audio>

<script>
  const PARTS = {
    kenhamo1:  'けんばんハーモニカ１',
    kenhamo2:  'けんばんハーモニカ２',
    recorder1: 'リコーダー１',
    recorder2: 'リコーダー２',
    tambourine: 'タンバリン',
    snare:     '小だいこ',
    bassdrum:  '大だいこ',
    cymbal:    'シンバル',
    glockenspiel: 'てっきん',
    xylophone: 'もっきん',
    bass:      '低音楽器（バスキー）',
  };
  const TRIAL = ['recorder1'];
  // 赤い わくの データ（パートごと）
  //   img: 楽譜画像の大きさ(px)、t0: 1小節目が 始まる 秒、measure: 1小節の 秒数（音源の テンポから 計測）
  //   ev: 演奏順（くり返し込み）の [わくの番号, 何小節目から]、boxes: わくの 位置 [x, y, 幅, 高さ](px)
  const SYNC = {
    recorder1: {"img":[1653,1900],"t0":0.054,"measure":1.307332,"ev":[[0,0],[1,8],[2,9],[3,10],[4,11],[5,12],[6,13],[7,14],[8,15],[9,16],[10,17],[11,18],[12,19],[13,20],[14,21],[15,22],[16,23],[17,24],[18,25],[19,26],[20,27],[21,28],[22,29],[23,30],[24,31],[25,32],[26,33],[27,34],[28,35],[29,36],[30,37],[31,38],[32,39],[33,40],[34,44],[1,48],[2,49],[3,50],[4,51],[5,52],[6,53],[7,54],[8,55],[9,56],[10,57],[11,58],[12,59],[13,60],[14,61],[15,62],[16,63],[17,64],[18,65],[19,66],[20,67],[21,68],[22,69],[23,70],[24,71],[25,72],[26,73],[27,74],[28,75],[29,76],[30,77],[35,78],[36,79],[37,80],[38,81],[39,82],[40,83],[41,84]],"boxes":[[185,182,307,239],[492,182,152,239],[644,182,127,239],[771,182,124,239],[895,182,127,239],[1022,182,127,239],[1149,182,127,239],[1275,182,127,239],[1402,182,134,239],[118,539,194,239],[312,539,126,239],[438,539,123,239],[561,539,126,239],[687,539,126,239],[813,539,126,239],[939,539,125,239],[1064,539,183,239],[1246,539,107,239],[1353,539,183,239],[118,895,180,239],[298,895,131,239],[428,895,107,239],[535,895,107,239],[643,895,107,239],[750,895,138,239],[888,895,131,239],[1018,895,131,239],[1149,895,126,239],[1275,895,131,239],[1405,895,131,239],[118,1252,206,239],[324,1252,131,239],[454,1252,131,239],[585,1252,131,239],[716,1252,154,239],[869,1252,107,239],[977,1252,131,239],[1107,1252,107,239],[1214,1252,107,239],[1322,1252,107,239],[1429,1252,107,239],[118,1609,206,239]]},
  };
  const audio = document.getElementById('audio');
  const score = document.getElementById('score');
  const play = document.getElementById('play');
  const bar = document.getElementById('bar');
  const time = document.getElementById('time');
  let rate = 1;
  let dragging = false;
  let current = 'recorder1';

  const fmt = s => {
    if (!isFinite(s)) s = 0;
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + String(r).padStart(2, '0');
  };
  const update = () => {
    const d = audio.duration || 0;
    if (!dragging) bar.value = d ? (audio.currentTime / d) * 100 : 0;
    time.textContent = fmt(audio.currentTime) + ' / ' + fmt(d);
  };
  const toggle = () => { audio.paused ? audio.play() : audio.pause(); };

  const selectPart = part => {
    if (!TRIAL.includes(part)) part = TRIAL[0];
    audio.pause();
    play.textContent = '▶ さいせい';
    audio.src = part + '.mp3';
    audio.playbackRate = rate;
    score.src = part + '.png';
    score.alt = 'ミッキーマウス・マーチ ' + PARTS[part] + ' の がくふ';
    document.querySelectorAll('[data-part]').forEach(b => {
      const on = b.dataset.part === part;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on);
    });
    current = part;
    partSel.value = part;
    updateToggle();
    if (location.hash !== '#' + part) history.replaceState(null, '', '#' + part);
    update();
  };

  document.querySelectorAll('[data-part]').forEach(b => {
    if (!TRIAL.includes(b.dataset.part)) { b.disabled = true; b.firstChild.textContent += ' 🔒'; }
  });
  document.querySelectorAll('[data-part]').forEach(b => {
    b.addEventListener('click', () => { selectPart(b.dataset.part); window.scrollTo(0, 0); });
  });

  play.addEventListener('click', toggle);
  document.getElementById('top').addEventListener('click', () => { audio.currentTime = 0; update(); });
  document.getElementById('back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); update(); });

  audio.addEventListener('play', () => { play.textContent = '⏸ とめる'; });
  audio.addEventListener('pause', () => { play.textContent = '▶ さいせい'; });
  audio.addEventListener('ended', () => { play.textContent = '▶ さいせい'; });
  audio.addEventListener('timeupdate', update);
  audio.addEventListener('loadedmetadata', () => { audio.playbackRate = rate; update(); });

  bar.addEventListener('input', () => {
    dragging = true;
    const d = audio.duration || 0;
    time.textContent = fmt(d * bar.value / 100) + ' / ' + fmt(d);
  });
  bar.addEventListener('change', () => {
    dragging = false;
    if (audio.duration) audio.currentTime = audio.duration * bar.value / 100;
  });

  document.querySelectorAll('[data-rate]').forEach(b => {
    b.addEventListener('click', () => {
      rate = Number(b.dataset.rate);
      audio.playbackRate = rate;
      document.querySelectorAll('[data-rate]').forEach(x => x.classList.toggle('on', x === b));
    });
  });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); toggle(); }
  });

  const nav = document.getElementById('partnav');
  const setNavH = () => document.documentElement.style.setProperty('--navh', nav.offsetHeight + 'px');
  new ResizeObserver(setNavH).observe(nav);
  setNavH();

  // パートのボタンを かくす／だす（えらんだ状態は この端末に おぼえておく）
  const navToggle = document.getElementById('navtoggle');
  const partBtn = document.getElementById('partbtn');
  function updateToggle() {
    const closed = nav.classList.contains('closed');
    const btn = document.querySelector('[data-part="' + current + '"]');
    const name = btn ? btn.firstChild.textContent.trim() : '';
    navToggle.textContent = '▲ パートを かくす';
    navToggle.setAttribute('aria-expanded', !closed);
    partBtn.textContent = '🎼 ' + name + ' ▼';
    partBtn.hidden = !closed;
  }
  partBtn.addEventListener('click', () => { setClosed(false); window.scrollTo(0, 0); });
  const setClosed = closed => {
    nav.classList.toggle('closed', closed);
    updateToggle();
    try { localStorage.setItem('partsClosed', closed ? '1' : '0'); } catch (e) {}
  };
  navToggle.addEventListener('click', () => setClosed(!nav.classList.contains('closed')));
  try { if (localStorage.getItem('partsClosed') === '1') nav.classList.add('closed'); } catch (e) {}

  // 演奏中の 小節を 赤く かこむ
  const hl = document.getElementById('hl');
  const hlCount = document.getElementById('hlcount');
  const headerBottom = () => document.querySelector('.player').getBoundingClientRect().bottom;
  // 赤い わくを 音より 少し 早めに 動かす 秒数（遅く 感じたら 大きく、早すぎたら 小さく）
  const LEAD = 0.2;
  let lastBox = -1, lastRow = null, lastPart = null;
  function drawHighlight() {
    const sync = SYNC[current];
    const t = audio.currentTime;
    if (!sync || (audio.paused && t === 0) || audio.ended) { hl.classList.remove('show'); lastBox = -1; return; }
    const u = Math.max(0, (t + LEAD * audio.playbackRate - sync.t0) / sync.measure);
    let i = 0;
    while (i + 1 < sync.ev.length && sync.ev[i + 1][1] <= u) i++;
    const [bi, start] = sync.ev[i];
    const len = i + 1 < sync.ev.length ? sync.ev[i + 1][1] - start : 1;
    const [x, y, w, h] = sync.boxes[bi];
    const [W, H] = sync.img;
    if (bi !== lastBox || current !== lastPart) {
      hl.style.left = (x / W * 100) + '%';
      hl.style.top = (y / H * 100) + '%';
      hl.style.width = (w / W * 100) + '%';
      hl.style.height = (h / H * 100) + '%';
      hl.classList.add('show');
      lastBox = bi;
      lastPart = current;
    }
    hlCount.textContent = len > 1 ? 'やすみ ' + Math.min(len, Math.floor(u - start) + 1) + ' / ' + len : '';
    // 段が かわったら、赤い わくが 見える 位置まで スクロール
    if (!audio.paused && y !== lastRow) {
      lastRow = y;
      const r = hl.getBoundingClientRect();
      const top = headerBottom();
      if (r.top < top + 8 || r.bottom > window.innerHeight - 8) {
        window.scrollBy({ top: r.top - top - 40, behavior: 'smooth' });
      }
    }
  }
  (function loop() { drawHighlight(); requestAnimationFrame(loop); })();

  // 楽譜を タッチすると、その 小節の 頭から 再生
  // くり返しで 2回 出てくる 小節は、いまの 再生位置に 近い ほうへ とぶ
  const START_EARLY = 0.1;     // 小節の 頭より 少しだけ 前から 鳴らす（秒）
  function seekToScore(e, img) {
    const sync = SYNC[current];
    if (!sync) return;
    const r = img.getBoundingClientRect();
    const [W, H] = sync.img;
    const px = (e.clientX - r.left) / r.width * W;
    const py = (e.clientY - r.top) / r.height * H;
    let bi = sync.boxes.findIndex(([x, y, w, h]) => px >= x && px < x + w && py >= y && py < y + h);
    if (bi < 0) {
      // 段の 左はし（ト音記号 など）を タッチしたときは、その 段の いちばん 近い 小節
      let best = Infinity;
      sync.boxes.forEach(([x, y, w, h], i) => {
        if (py < y || py >= y + h) return;
        const d = Math.min(Math.abs(px - x), Math.abs(px - (x + w)));
        if (d < best) { best = d; bi = i; }
      });
    }
    if (bi < 0) return;
    const el = audio;
    const offset = 0;
    const nowU = (el.currentTime - offset - sync.t0) / sync.measure;
    let target = null;
    for (const [b, start] of sync.ev) {
      if (b !== bi) continue;
      if (target === null || Math.abs(start - nowU) < Math.abs(target - nowU)) target = start;
    }
    if (target === null) return;
    el.currentTime = Math.max(0, sync.t0 + target * sync.measure + offset - START_EARLY);
    lastBox = -1;
    if (el.paused) el.play();
    update();
  }
  score.addEventListener('click', e => seekToScore(e, score));

  // パートの ドロップダウン（グループ分けと ★は ボタンの 段と 同じ）
  const GROUP_NAMES = { 'パート': 'ふえ・けんばんハーモニカ', 'がっき': 'てっきん・もっきん・低音楽器', 'だがっき': 'だがっき' };
  const partSel = document.getElementById('partsel');
  document.querySelectorAll('.parts').forEach(g => {
    const og = document.createElement('optgroup');
    og.label = GROUP_NAMES[g.getAttribute('aria-label')] || '';
    g.querySelectorAll('[data-part]').forEach(b => {
      const o = document.createElement('option');
      o.value = b.dataset.part;
      const stars = b.querySelector('small');
      o.textContent = b.firstChild.textContent.trim() + (stars ? '　' + stars.textContent : '');
      o.disabled = b.disabled;
      og.appendChild(o);
    });
    partSel.appendChild(og);
  });
  partSel.addEventListener('change', () => { selectPart(partSel.value); window.scrollTo(0, 0); });

  selectPart(location.hash.slice(1));
</script>
</body>
</html>
